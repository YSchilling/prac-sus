# CPU staircase on the measured SUT: idle, then 5/10/15/20 busy threads
# (sut-01/02 have 20 hardware threads, so 15 and 20 push past one thread per
# core and exercise ratio_over_half), then idle again. About 14 minutes.
#
#   kubectl apply -f workloads/stress-ng-job.yaml
#   kubectl logs -f job/stress-ng
#
# Each step prints a UTC timestamp so the run can be matched to Prometheus.
apiVersion: batch/v1
kind: Job
metadata:
  name: stress-ng
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: stress-ng
    spec:
      restartPolicy: Never
      nodeSelector:
        role: sut
      containers:
        - name: stress-ng
          image: debian:trixie-slim
          env:
            - name: DEBIAN_FRONTEND
              value: noninteractive
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              apt-get update -qq && apt-get install -y -qq --no-install-recommends stress-ng >/dev/null
              mark() { echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) $*"; }
              mark "idle start"; sleep 90
              for n in 5 10 15 20; do
                for load in 50 100; do
                  mark "cpu=$n load=$load start"
                  stress-ng --cpu "$n" --cpu-load "$load" --timeout 75s --metrics-brief
                done
              done
              mark "idle start"; sleep 90
              mark "done"
